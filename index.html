<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ghost Light</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="scene">


    <div class="dust-layer dust-dark"></div>

    <div class="dust-layer dust-light"></div>

    <div class="text-layer text-dark">

      <div class="fragment fragment-1">
        THERE WAS
      </div>

      <div class="fragment fragment-2">
        SOMETHING HERE
      </div>

      <div class="fragment fragment-3">
        BEFORE<br>
        THE LIGHT
      </div>

      <div class="fragment fragment-4">
        FORGOTTEN
      </div>

      <div class="fragment fragment-5">
        STILL<br>
        MOVING
      </div>

      <div class="fragment fragment-6">
        I REMEMBER
      </div>

    </div>


    <div
      class="text-layer text-light"
      aria-hidden="true"
    >

      <div class="fragment fragment-1">
        THERE WAS
      </div>

      <div class="fragment fragment-2">
        SOMETHING HERE
      </div>

      <div class="fragment fragment-3">
        BEFORE<br>
        THE LIGHT
      </div>

      <div class="fragment fragment-4">
        FORGOTTEN
      </div>

      <div class="fragment fragment-5">
        STILL<br>
        MOVING
      </div>

      <div class="fragment fragment-6">
        I REMEMBER
      </div>

    </div>


    <div
      id="light"
      class="light"
    ></div>


    <div
      id="ghost"
      class="ghost"
    >

      <svg
        viewBox="0 0 512 512"
        xmlns="http://www.w3.org/2000/svg"
      >

        <path
          class="ghost-body"
          d="m508.374 432.802s-46.6-39.038-79.495-275.781c-8.833-87.68-82.856-156.139-172.879-156.139-90.015 0-164.046 68.458-172.879 156.138-32.895 236.743-79.495 275.782-79.495 275.782-15.107 25.181 20.733 28.178 38.699 27.94 35.254-.478 35.254 40.294 70.516 40.294 35.254 0 35.254-35.261 70.508-35.261s37.396 45.343 72.65 45.343 37.389-45.343 72.651-45.343c35.254 0 35.254 35.261 70.508 35.261s35.27-40.772 70.524-40.294c17.959.238 53.798-2.76 38.692-27.94z"
        />

        <circle
          class="eye"
          cx="208"
          cy="225"
          r="22"
        />

        <circle
          class="eye"
          cx="297"
          cy="225"
          r="22"
        />

      </svg>

    </div>

  </main>


  <script src="sketch.js"></script>
</body>
</html>
